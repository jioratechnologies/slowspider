services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/.env
    depends_on:
      - nats
    expose:
      - "3001"
    restart: unless-stopped

  # Realtime backbone (Phase 5, whole-record live sync — see
  # docs/MIGRATION-PLAN-bff-kong-split.md). Fully internal to the Docker network as of the
  # realtime-auth fix: only apps/backend ever speaks NATS now (its NatsService publisher, and
  # RealtimeGateway's server-to-server subscriber for the /v1/realtime WS relay). Browsers no
  # longer connect to NATS directly — no port here is published to the host at all, so there
  # is nothing for the internet (or anything outside this compose network) to reach.
  # NATS_AUTH_TOKEN is read from apps/backend/.env — kept as defense-in-depth even though the
  # socket is no longer reachable from outside the Docker network at all (see
  # infra/nats/nats.conf).
  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    ports:
      - "127.0.0.1:8222:8222" # HTTP monitoring/health endpoint — localhost-only, same pattern as Kong's admin API
    restart: unless-stopped

  kong:
    image: kong:3.9
    depends_on:
      - backend
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000" # proxy — every client (web/android/iOS) hits this; Coolify maps external port
      - "127.0.0.1:8001:8001" # admin API, localhost-only
    restart: unless-stopped

volumes:
  nats-data: # JetStream store — persists so a restart doesn't lose recent replay history

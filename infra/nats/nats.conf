# NATS server config — Phase 5 of docs/MIGRATION-PLAN-bff-kong-split.md ("whole-record live
# sync" half only; the CRDT/Yjs half of that section is out of scope and not built here).
# Single self-hosted instance, same "lowest ops for a solo maintainer" reasoning as
# infra/kong/kong.yml: one binary, one config file, no clustering, no separate admin DB.

# HTTP monitoring endpoint (health checks, connection/subscription counts). Bound to the
# Docker network only in docker-compose.yml (127.0.0.1-only port mapping), same pattern as
# Kong's admin API.
http_port: 8222

# JetStream — gives durable replay, so a client that reconnects after a brief drop can
# catch up on recent events instead of silently missing them (see the migration doc's
# Realtime section). Store directory is a container-local volume (see docker-compose.yml).
jetstream {
  store_dir: "/data/jetstream"
}

# No `websocket {}` listener — browsers no longer connect to NATS at all (realtime-auth fix,
# see docs/MIGRATION-PLAN-bff-kong-split.md's Realtime section). apps/web now talks to
# apps/backend's own authenticated WS relay (GET /v1/realtime) instead; only the backend
# itself speaks NATS, over the plain client protocol on the Docker-internal network. This
# container publishes no ports to the host at all (see docker-compose.yml) — there is nothing
# here for anything outside the compose network to reach, let alone a browser.

# --- Auth: kept as defense-in-depth, no longer the security boundary it used to be ---
# A shared bearer token still gates the plain client-protocol port, matching
# apps/backend/.env's NATS_AUTH_TOKEN. This USED to be the whole security story for this
# socket (a single token, shipped to every browser via NEXT_PUBLIC_NATS_AUTH_TOKEN, gating
# access to every workspace's subject with no per-workspace authorization at all — see git
# history / the migration doc's earlier Phase 5 writeup for that gap). Now that NATS is
# reachable only from apps/backend, on the Docker-internal network, that gap is closed
# structurally rather than by this token: nothing that can reach this port is untrusted.
# The token stays purely as a second layer, cheap to keep, in case something else ever joins
# this Docker network.
authorization {
  token: $NATS_AUTH_TOKEN
}

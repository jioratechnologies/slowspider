# NATS server config — Phase 5 of docs/MIGRATION-PLAN-bff-kong-split.md ("whole-record live
# sync" half only; the CRDT/Yjs half of that section is out of scope and not built here).
# Single self-hosted instance, same "lowest ops for a solo maintainer" reasoning as
# infra/kong/kong.yml: one binary, one config file, no clustering, no separate admin DB.

# HTTP monitoring endpoint (health checks, connection/subscription counts).
http_port: 8222

# JetStream — gives durable replay, so a client that reconnects after a brief drop can
# catch up on recent events instead of silently missing them (see the migration doc's
# Realtime section). Store directory is a container-local volume (see docker-compose.yml).
jetstream {
  store_dir: "/data/jetstream"
}

# Browsers (apps/web, and later apps/mobile) connect to this directly — NATS traffic
# bypasses Kong entirely, same reasoning as Supabase Realtime's direct-client-WS pattern
# that this replaces (see docs/MIGRATION-PLAN-bff-kong-split.md).
websocket {
  port: 8080
  no_tls: true # local dev only — put a TLS-terminating proxy in front of this in any real deployment
}

# --- Auth: KNOWN SIMPLIFICATION — see docs/MIGRATION-PLAN-bff-kong-split.md, Phase 5 ---
# A single shared bearer token gates the socket so it isn't fully open to the internet, but
# it does NOT do per-workspace subject authorization: anyone holding NATS_AUTH_TOKEN can
# subscribe to ANY workspace's `ws.<id>.change` subject, not just workspaces they're a
# member of. The migration doc's originally-planned "NATS decentralized JWT auth keyed off
# the same JWT the backend already issues" (per-workspace subject permissions enforced at
# the NATS server itself) is explicitly NOT implemented in this pass — this is an accepted
# gap for now (solo maintainer, pre-production), not something silently papered over.
# Revisit before any real multi-tenant/production exposure.
authorization {
  token: $NATS_AUTH_TOKEN
}
